name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Typecheck, tests, build, end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build:single
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests (solo, classroom, hot-seat)
        run: |
          npx vite preview --port 1420 --strictPort &
          for i in $(seq 1 30); do curl -sf http://localhost:1420/ > /dev/null && break; sleep 1; done
          node tests/e2e/smoke.mjs http://localhost:1420/ test-results/screens
          node tests/e2e/classroom.mjs http://localhost:1420/ test-results/classroom
          node tests/e2e/engagement.mjs http://localhost:1420/ test-results/engagement
      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: test-results/
          if-no-files-found: ignore
      - name: Single-file web version
        run: cp dist-single/index.html FoundersDilemma-web.html
      - uses: actions/upload-artifact@v4
        with:
          name: founders-dilemma-web
          path: FoundersDilemma-web.html

  desktop-shell:
    name: Desktop shell (Rust)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: System libraries for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - run: npm ci
      - run: npm run build
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --locked
